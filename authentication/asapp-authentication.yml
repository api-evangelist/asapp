notes: >-
  ASAPP authenticates every request with a paired API Id and API Secret sent as
  two headers: asapp-api-id and asapp-api-secret. Keys are issued per environment
  (sandbox vs production). No OAuth2/OIDC surface is published. Base URLs:
  https://api.asapp.com (production), https://api.sandbox.asapp.com (sandbox).
