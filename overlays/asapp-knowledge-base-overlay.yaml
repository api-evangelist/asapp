overlay: 1.0.0
info:
  title: API Evangelist enhancements for ASAPP Knowledge Base API
  version: 1.0.0
extends: openapi/asapp-knowledge-base-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-apievangelist-provider: asapp
    x-apievangelist-auth: API Id + API Secret headers (asapp-api-id / asapp-api-secret)
    x-apievangelist-base-urls:
      production: https://api.asapp.com
      sandbox: https://api.sandbox.asapp.com
    x-apievangelist-conventions: conventions/asapp-conventions.yml
    x-apievangelist-errors: errors/asapp-problem-types.yml
