aid: asapp
name: ASAPP
description: >-
  ASAPP is an AI-native customer experience (CX) company whose platform, ASAPP CXP,
  automates and augments contact-center interactions across voice and chat. Its
  flagship GenerativeAgent resolves customer issues autonomously while keeping a
  human in the loop (HILA), backed by AI productivity tools (AutoCompose agent
  suggestions, AI Summary, AI Transcribe), a Knowledge Base, Digital Agent Desk,
  and Insights. ASAPP exposes a REST API platform (api.asapp.com) covering
  Conversations, Messages, GenerativeAgent, AutoSummary, AutoCompose, AutoTranscribe,
  Knowledge Base, Metadata Ingestion, File Exporter, Partner Configuration, and a
  webhook-based Real-Time Event API, secured with API Id + API Secret credentials.
  Backed by Emergence Capital. Enriched from the provider's public developer docs.
