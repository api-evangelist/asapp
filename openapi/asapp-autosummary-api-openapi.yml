  /autosummary/v1/feedback/free-text-summaries/{conversationId}:
    parameters:
    - name: conversationId
      description: The identifier for a conversation.
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z0-9]+$
    - name: agentExternalId
      description: Your unique identifier for the agent.
      in: query
      required: false
      schema:
        type: string
    post:
      tags:
      - AutoSummary
      summary: Provide feedback.
      description: "Create a feedback event with the full and updated summary. Each event is associated with a specific summary id. \n\nThe event must contain the final summary, in the form of text.        \n"
      operationId: createFeedbackEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Information regarding the updated free-text summary. It must contain the full updated summary as a string.

                '
              properties:
                externalConversationId:
                  description: 'Your unique identifier for the conversation. This must match to the `externalConversationId` you used in the Conversations API.

                    '
                  type: string
                summaryId:
                  description: 'The identifier of the summary you are providing feedback on.

                    '
                  type: string
                summaryText:
                  description: The full text of the final summary.
                  type: string
              required:
              - summaryId
              - summaryText
              example:
                externalConversationId: 01GCS2XA9447BCQANJF2SXXVA0
                summaryId: 0083d936-ff70-49fc-ac19-74f1246d8b27
                summaryText: 'The customer has issues with his symmetric internet service.

                  The customer explained the service has not enough bandwidth.

                  The customer explained the service has not enough bandwidth.

                  The agent explained how to run a diagnosis.

                  The customer ran the diagnosis.

                  '
