  /autocompose/v1/spellcheck/correction:
    post:
      tags:
      - AutoCompose
      operationId: getSpellingCorrection
      summary: Check for spelling mistakes
      description: 'Get spelling correction for a message as it is being typed, if there is a misspelling. Only the current word

        will be corrected, once it''s fully typed (so it is recommended to call this endpoint after space characters).

        '
      requestBody:
        description: The parameters for getting a spelling correction as a message is being typed.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  description: Text being typed by the agent, already entered into the composer
                  type: string
                typingEvent:
                  type: object
                  properties:
                    cursorStart:
                      description: Position of the cursor before the typing event, to identify if a word is being typed
                      type: integer
                    cursorEnd:
                      description: Position of the cursor after the typing event, to identify if a word is being typed
                      type: integer
                  required:
                  - cursorStart
                  - cursorEnd
                userDictionary:
                  description: Words that should not be corrected if they are present on the text
                  type: array
                  items:
                    type: string
                language:
                  description: Optional IETF language tag of the text. If not provided, the default language will be assumed which most likely will be English but it could be a different language depending on the customer setup.
                  type: string
              required:
              - text
              - typingEvent
              example:
                text: 'How is tihs '
                typingEvent:
                  cursorStart: 11
                  cursorEnd: 12
                userDictionary:
                - Hellooo
                language: en
      responses:
        '200':
          description: Successfully checked for a spelling mistake.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: ID for the spelling correction that was returned (to be used in analytics events)
                    type: string
                    example: 01BX5ZZKBKACTAV9WEVGEMMVS1
                  misspelledText:
                    description: misspelling that needs to be replaced with the corrected text
                    type: string
                    example: tihs
                  correctedText:
                    type: string
                    description: correction for the misspelling
                    example: this
                  position:
                    type: integer
                    description: position where the misspelling starts
                    example: 7
        '400':
          description: 400 - Bad request
          content:
            application/json:
              schema:
                description: Bad request response
                type: object
                properties:
                  error:
