  /autocompose/v1/profanity/evaluation:
    post:
      tags:
      - AutoCompose
      operationId: getEvaluation
      summary: Evaluate profanity
      description: 'Get an evaluation of a text to verify if it contains profanity, obscenity or other unwanted words. This service should be called before sending a message to prevent the agent from sending profanities in the chat.

        '
      requestBody:
        description: The parameters for getting a evaluation result of the text typed by the user.
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  description: text to be checked for profanity
                  type: string
              example:
                text: This is a perfectly decent sentence.
      responses:
        '200':
          description: Successfully fetched a evaluation result of the sentence.
          content:
            application/json:
              schema:
                description: ProfanityResult
                type: object
                properties:
                  hasProfanity:
                    description: A boolean value describing if the text contains a curse word.
                    type: boolean
                    example: false
        '400':
