  /autocompose/v1/responses/globals:
    get:
      tags:
      - AutoCompose
      summary: List the global responses
      description: Get the global responses and folder organization for a company. Responses are sorted by text, and folders are sorted by name.
      operationId: getGlobalResponses
      parameters:
      - in: query
        name: folderId
        schema:
          type: string
        required: false
        description: Optional identifier for the ID of the folder containing responses to be retrieved. If this is omitted, all global responses are returned.  Data format is expected to be UUID. The special value '__root' can also be used to retrieve top level folders/responses.
      - in: query
        name: resourceType
        schema:
          type: string
          enum:
          - folders
          - responses
          - all
          default: all
        required: false
        description: Optional identifier for the ID of the type of responses to be retrieved. A value of 'folders' will return only folder information describing the way responses are organized. A value of 'responses' will return only responses. A value of 'all' will return a mix of folders and responses. Note that if the folderId parameter is specified as well, only the resource type identified here that exists within the specified folder will be returned. If this is omitted, all resources are returned.
      - in: query
        name: searchTerm
        schema:
          type: string
        required: false
        description: Search term to search for global responses. This will search for matching folder names, response text or both, depending on the resourceType parameter value.
        example: greetings
      - in: query
        name: pageToken
        description: This service responds with a set of global responses. These are divided into pages, with maxPerPage items in each page. This parameter is the page token returned in the call prior to this one. If this is the first call being made, this field should be omitted. The server will respond with global responses following the one previously sent.
        required: false
        schema:
          type: string
        example: '3'
      - in: query
        name: maxPerPage
        description: The maximum number of custom responses the client can handle within one page
        required: false
        schema:
          type: integer
          default: 1000
      responses:
        '200':
          description: The global responses for this company
          content:
            application/json:
              schema:
                type: object
                properties:
                  responses:
                    type: object
                    description: A set of responses and folders for an agent
                    properties:
                      responsesList:
                        type: array
                        description: the list of responses with their associated metadata
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of this response, data format is UUID
                              readOnly: true
                            text:
                              type: string
                              description: The text of the response
                            title:
                              type: string
                              description: The title of the response. Always non-empty for custom responses, but may be empty for other types of responses (global and organic).
                            folderId:
                              type: string
                              description: the ID of the folder the response belongs to.
                            metadata:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    description: the name of this metadata item
                                  allowedValues:
                                    type: array
                                    items:
                                      type: string
                                    description: the list of allowed values for this metadata item
                              description: free-form metadata, in the form of a map of keys to lists of allowed values for each key, that can be added to any response. At least one of the values in the list for each key included  here must match what gets sent when requesting suggestions, so that responses can be filtered appropriately.
                      folderList:
                        type: array
                        description: the list of folders
                        items:
                          type: object
                          description: A folder of responses
                          properties:
                            id:
                              type: string
                              description: The ID of the folder
                              readOnly: true
                            parentFolderId:
                              type: string
                              description: The ID of the parent folder.
                            name:
                              type: string
                              description: the name of the folder
                          required:
                          - name
                          example:
                            id: '123'
                            parentFolderId: '456'
                            name: folder name
                      pageToken:
                        type: string
                        description: the token to the next page if there is one, otherwise empty
                  version:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The ID of this version of the global responses
                        readOnly: true
                      description:
                        type: string
                        description: A human-readable description of the version
        '400':
          description: 400 - Bad request
          content:
            application/json:
              schema:
                description: Bad request response
                type: object
                properties:
                  error:
                    example:
                      requestId: 8e033668-9f1a-11ec-b909-0242ac120002
                      code: 400-01
                      message: Bad request
                    description: Error details
                    type: object
                    properties:
                      requestId:
                        type: string
                        description: Unique ID of the failing request
                      message:
                        type: string
                        description: Error message
                      code:
                        type: string
                        description: Error code
                    required:
                    - requestId
                    - message
        '401':
