  /autocompose/v1/conversations/{conversationId}/message-analytic-events:
    parameters:
    - name: conversationId
      description: The identifier for a conversation.
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z0-9]+$
    post:
      tags:
      - AutoCompose
      operationId: createMessageAnalyticEvent
      summary: Create a message analytic event
      description: 'To improve the performance of ASAPP suggestions, provide information about the actions performed by the agent while composing a message by creating `message-analytic-events`.


        These analytic events indicate which AutoCompose functionality was used or not. This information along with the conversation itself is used to optimize our models, resulting in better results for the agents.


        We track the following types of message analytic events:

        - suggestion-1-inserted: The agent selected the first of the `suggestions` from a `Suggestion` API response.

        - suggestion-2-inserted: The agent selected the second of the `suggestions` from a `Suggestion` API response.

        - suggestion-3-inserted: The agent selected the third of the `suggestions` from a `Suggestion` API response.

        - phrase-completion-accepted: The agent selected the `phraseCompletion` from a `Suggestion` API response.

        - spellcheck-applied: A correction provided in a `SpellcheckCorrection` API response was applied automatically.

        - spellcheck-undone: A correction provided in a `SpellcheckCorrection` API response was undone by clicking the undo button.

        - custom-response-drawer-inserted: The agent inserted one of their custom responses from the custom response drawer.

        - custom-panel-inserted: The agent inserted a response from their custom response list in the custom response panel.

        - global-panel-inserted: The agent inserted a response from the global response list in the global response panel.


        Some of the event types have a corresponding event object to provide details.

        '
      requestBody:
        description: The parameters for reporting the analytic event
        content:
          application/json:
            schema:
              description: 'Analytics event reporting actions the agent performed while composing a message.

                '
              type: object
              required:
              - type
              - suggestionsId
              example:
                type: suggestion-1-inserted
                suggestionsId: 4d2fd982640c311394008259594399a1
              properties:
                type:
                  type: string
                  example: suggestion-1-inserted
                  enum:
                  - suggestion-1-inserted
                  - suggestion-2-inserted
                  - suggestion-3-inserted
                  - phrase-completion-accepted
                  - spellcheck-applied
                  - spellcheck-undone
                  - custom-response-drawer-inserted
                  - custom-panel-inserted
                  - global-panel-inserted
                  description: 'The type of message analytic event.

                    '
                suggestionsId:
                  description: 'For suggestion-1-inserted, suggestion-2-inserted, suggestion-3-inserted, phrase-completion-accepted,

                    this is the `id` from the Suggestions API response that the agent

                    interacted with. This allows ASAPP to connect the event with additional information (e.g., the

                    text of the suggestion that was inserted).


                    For spellcheck-undone, custom-response-drawer-inserted, custom-panel-inserted, and global-panel-inserted, this is the

                    `id` of the most recent Suggestions API response in this conversation.


                    In all of these cases, providing the Suggestions `id` allows ASAPP to associate the event with the message the agent

                    is composing. During the normal flow of using the AutoCompose API, the Suggestions API will always have been called

                    at least once since the previous agent message by the time a message analytic event occurs, and each time the

                    Suggestions API is called, ASAPP records the ID of the previous

                    agent message. Thus, the Suggestions `id` in the analytic event links back to the previous agent message. This permits

                    the analytic event to later be linked to the new message the agent is composing, even though the event occurs before

                    the message is sent.

                    '
                  type: string
                  example: 4d2fd982640c311394008259594399a1
                spellcheckApplied:
                  type: object
                  description: 'The details about the spellcheck applied analytic event

                    '
                  nullable: true
                  properties:
                    correctionId:
                      description: The ID of the spellcheck correction API response
                      type: string
                      example: 75bc8912c66842594375bc8912c66842
                  required:
                  - correctionId
                spellcheckUndone:
                  type: object
                  description: 'The details about the spellcheck undone analytic event

                    '
                  nullable: true
                  properties:
                    correctionId:
                      description: The ID of the spellcheck correction API response
                      type: string
                      example: 75bc8912c66842594375bc8912c66842
                  required:
                  - correctionId
                customResponseDrawerInserted:
                  type: object
                  description: The details about the custom response drawer inserted analytic event
                  nullable: true
                  properties:
                    query:
                      description: 'The query the agent typed to search in the custom response drawer

                        '
                      type: string
                      example: Hi
                    text:
                      description: 'The text of the custom response the agent inserted from the custom response drawer

                        '
                      type: string
                      example: Hi, I'm Alice. How can I help you today?
                  required:
                  - query
                  - text
                customPanelInserted:
                  type: object
                  description: The details about the custom panel inserted analytic event
                  nullable: true
                  properties:
                    text:
                      description: 'The text of the custom response the agent inserted using the custom response panel

                        '
                      type: string
                      example: Hi, I'm Alice. How can I help you today?
                  required:
                  - text
                globalPanelInserted:
                  type: object
                  description: The details about the global panel inserted analytic event
                  nullable: true
                  properties:
                    text:
                      description: 'The text of the custom response the agent inserted using the global response panel

                        '
                      type: string
                      example: How can I help you today?
                  required:
                  - text
            examples:
              Create a suggestion-inserted event.:
                value:
                  type: suggestion-1-inserted
                  suggestionsId: 4d2fd982640c311394008259594399a1
              Create a spellcheck-applied event.:
                value:
                  type: spellcheck-applied
                  suggestionsId: 4d2fd982640c311394008259594399a1
                  spellcheckApplied:
                    correctionId: 75bc8912c66842594375bc8912c66842
              Create a spellcheck-undone event.:
                value:
                  type: spellcheck-undone
                  suggestionsId: 4d2fd982640c311394008259594399a1
                  spellcheckUndone:
                    correctionId: 75bc8912c66842594375bc8912c66842
              Create a custom-response-drawer-inserted event.:
                value:
                  type: custom-response-drawer-inserted
                  suggestionsId: 4d2fd982640c311394008259594399a1
                  customResponseDrawerInserted:
                    query: Hi
                    text: Hi, I'm Alice. How can I help you today?
              Create a custom-panel-inserted event.:
                value:
                  type: custom-panel-inserted
                  suggestionsId: 4d2fd982640c311394008259594399a1
                  customPanelInserted:
                    text: Hi, I'm Alice. How can I help you today?
              Create a global-panel-inserted event.:
                value:
                  type: global-panel-inserted
                  suggestionsId: 4d2fd982640c311394008259594399a1
                  globalPanelInserted:
                    text: How can I help you today?
      responses:
