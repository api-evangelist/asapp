  /conversation/v1/conversations/{conversationId}/messages:
    parameters:
    - name: conversationId
      description: The identifier for a conversation.
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z0-9]+$
    post:
      tags:
      - Conversations
      operationId: createMessage
      summary: Create a message
      description: 'Creates a message object, adding it to an existing conversation.


        Use this endpoint to record each new message in the conversation.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Represents a single message within a conversation.
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  description: The content of the message.
                sender:
                  description: Information about the participant who sent the message.
                  type: object
                  properties:
                    role:
                      description: The role of the participant in the conversation.
                      type: string
                      enum:
                      - agent
                      - customer
                      - system
                    externalId:
                      type: string
                      description: The unique identifier for the participant in your external system. This should be consistent across all interactions for the same individual.
                  required:
                  - role
                  - externalId
                timestamp:
                  type: string
                  format: date-time
                  description: The time when the message was sent. Include the timezone, otherwise UTC will be assumed.
              required:
              - text
              - sender
              - timestamp
              example:
                text: Hello, I would like to upgrade my internet plan to GOLD.
                sender:
                  role: agent
                  externalId: 123
                timestamp: '2021-11-23T12:13:14.555Z'
      responses:
        '200':
          description: Successfully created message in conversation
          content:
            application/json:
              schema:
                description: Response for messages
                type: object
                properties:
                  id:
                    type: string
                    description: Message ID to be used for analytics
                example:
                  id: 01BX5ZZKBKACTAV9WEVGEMMVS1
        '400':
          description: 400 - Bad request
          content:
            application/json:
              schema:
                description: Bad request response
                type: object
                properties:
                  error:
                    example:
                      requestId: 8e033668-9f1a-11ec-b909-0242ac120002
                      code: 400-01
                      message: Bad request
                    description: Error details
                    type: object
                    properties:
                      requestId:
