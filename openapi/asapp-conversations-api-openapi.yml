  /conversation/v1/conversation/messages:
    get:
      tags:
      - Conversations
      operationId: getMessagesByExternalId
      summary: List messages with an externalId
      description: 'Get all messages from a conversation.

        '
      parameters:
      - name: externalId
        description: Your identifier for a conversation.
        in: query
        required: true
        schema:
          type: string
        example:
          externalId: id-111
      responses:
        '200':
          description: Successfully fetched messages from a conversation
          content:
            application/json:
              schema:
                description: Response for GetMessages
                type: object
                properties:
                  items:
                    type: array
                    items:
                      description: A message sent by a participant of a conversation
                      type: object
                      properties:
                        text:
                          type: string
                          minLength: 1
                          description: Text sent
                        sender:
                          description: A participant within a conversation
                          type: object
                          properties:
                            role:
                              description: 'A participant role, usually the customer or an agent for human participants. System participant is also allowed but keep in mind

                                that this role won''t be considered a participant in a conversation, just a message sender.

                                '
                              type: string
                              enum:
                              - agent
                              - customer
                              - system
                            externalId:
                              type: string
                              nullable: true
                              description: The unique identifier for the relevant participant role.
                          required:
                          - role
                        messageId:
                          type: string
                          minLength: 1
                          description: The identifier of the message.
                        createdTimestamp:
                          type: string
                          format: date-time
                          description: The time when the message objectwas created in the ASAPP system.
                        clientTimestamp:
                          type: string
                          format: date-time
                          description: The timestamp of when the message was sent.
                      required:
                      - text
                      - sender
                      - messageId
                      - createdTimestamp
                      - clientTimestamp
                      example:
                        text: Hello, I would like to upgrade my internet plan to GOLD.
                        sender:
                          role: customer
                          externalId: '123456'
                        messageId: 01GMXE90AEV7H3J4DPBDKB1R79
