  /conversation/v1/conversations/{conversationId}/messages/batch:
    parameters:
    - name: conversationId
      description: The identifier for a conversation.
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z0-9]+$
    post:
      tags:
      - Conversations
      operationId: createBatchMessages
      summary: Create multiple messages
      description: 'This creates multiple message objects at once, adding them to an existing conversation.


        Use this endpoint when you need to add several messages at once, such as when importing historical conversation data.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A batch of messages for conversation
              type: object
              properties:
                messages:
                  type: array
                  items:
                    description: Represents a single message within a conversation.
                    type: object
                    properties:
                      text:
                        type: string
                        minLength: 1
                        description: The content of the message.
                      sender:
                        description: Information about the participant who sent the message.
                        type: object
                        properties:
                          role:
                            description: The role of the participant in the conversation.
                            type: string
                            enum:
                            - agent
                            - customer
                            - system
                          externalId:
                            type: string
                            description: The unique identifier for the participant in your external system. This should be consistent across all interactions for the same individual.
                        required:
                        - role
                        - externalId
                      timestamp:
                        type: string
                        format: date-time
                        description: The time when the message was sent. Include the timezone, otherwise UTC will be assumed.
                    required:
                    - text
                    - sender
                    - timestamp
                    example:
                      text: Hello, I would like to upgrade my internet plan to GOLD.
                      sender:
                        role: agent
                        externalId: 123
                      timestamp: '2021-11-23T12:13:14.555Z'
                  minItems: 1
                  maxItems: 300
              example:
                messages:
                - text: Hello, I would like to upgrade my internet plan to GOLD.
                  sender:
                    role: customer
                    externalId: customer-xyz
                  timestamp: '2021-11-23T12:13:14.555Z'
                - text: Let me help you with that
                  sender:
                    role: agent
                    externalId: agent-111
                  timestamp: '2021-11-23T12:13:16.666Z'
      responses:
        '200':
          description: Successfully created messages in conversation
          content:
            application/json:
              schema:
                description: Response for batch messages
                type: object
        '400':
          description: 400 - Bad request
          content:
            application/json:
              schema:
                description: Bad request response
                type: object
                properties:
                  error:
                    example:
                      requestId: 8e033668-9f1a-11ec-b909-0242ac120002
                      code: 400-01
                      message: Bad request
                    description: Error details
                    type: object
                    properties:
                      requestId:
                        type: string
                        description: Unique ID of the failing request
                      message:
                        type: string
                        description: Error message
                      code:
                        type: string
                        description: Error code
                    required:
                    - requestId
                    - message
        '401':
          description: 401 - Unauthorized
          content:
            application/json:
              schema:
                description: Unauthorized response
                type: object
                properties:
                  error:
                    example:
                      requestId: 8e033668-9f1a-11ec-b909-0242ac120002
