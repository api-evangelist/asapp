  /generativeagent/v1/complete-transfer:
    post:
      tags:
      - GenerativeAgent
      operationId: completeCallTransfer
      summary: Complete Call Transfer with phone number.
      description: 'Complete Call Transfer with phone number.


        Used by ASAPP to release phone number back to the pool and update Call Transfer resource status.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Post Complete Call Transfer Request
              type: object
              properties:
                type:
                  description: Enum to identify how the call will be transferred to ASAPP.
                  type: string
                  enum:
                  - PHONE_NUMBER
                  - SIP
                phoneNumber:
                  description: ASAPP Phone Number which received the call. Only used if `type` is `PHONE_NUMBER`.
                  type: string
                  example: '+19995550199'
                transferId:
                  description: Call Transfer unique identifier.
                  type: string
                  example: 0867617078-0032318833-2221801472-0002236962
              required:
              - type
              example:
                type: PHONE_NUMBER
                phoneNumber: '+19995550199'
      responses:
        '200':
          description: Acknowledgement that the complete call transfer request was successful.
          content: {}
        '400':
          description: 400 - Bad request
          content:
            application/json:
              schema:
