    post:
      tags:
      - Configuration
      summary: Create a structured data field
      description: "Creates a new structured data field configuration that defines what information should be\nextracted from conversations.\n\nThis endpoint supports creating two types of structured data fields:\n1. QUESTION type: Defines specific questions to be answered about the conversation\n   Example: \"Did the agent offer the correct promotion?\"\n\n2. ENTITY type: Defines entities to be identified and extracted\n   Example: Product names mentioned in the conversation\n\nThese fields are used by the Structured Data API (/apis/autosummary/retrieve-structured-data)\nto automatically extract the configured information from conversations.\n"
      operationId: postStructuredDataField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - title: Question
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the structured data field
                    example: q_promotion_was_offered
                  name:
                    type: string
                    description: The name of the structured data field
                    example: Promotion was offered
                  categoryId:
                    type: string
                    description: 'The category of the structured data field.

                      Possible values:

                      - OUTCOME

                      '
                    example: OUTCOME
                  type:
                    type: string
                    description: 'The type of the structured data field. Must be either:

                      - QUESTION

                      - ENTITY

                      '
                    example: QUESTION
                  active:
                    type: boolean
                    description: Indicates if the structured data is active or not.
                    example: false
                  question:
                    type: object
                    properties:
                      question:
                        type: string
                        description: The question that will be answered using the context of the conversation
                        example: Did the agent offer the correct promotion?
                    required:
                    - question
                  segmentIds:
                    type: array
                    items:
                      type: string
                      description: The segment ids that the structured data field is associated with
                      example: GLOBAL
                required:
                - id
                - active
                - question
                - type
                - categoryId
                - name
                - segmentIds
                example:
                  id: q_promotion_was_offered
                  name: Promotion was offered
