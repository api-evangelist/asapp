                    items:
                      oneOf:
                      - title: Question
                        type: object
                        properties:
                          id:
                            type: string
                            description: The id of the structured data field
                            example: q_promotion_was_offered
                          name:
                            type: string
                            description: The name of the structured data field
                            example: Promotion was offered
                          categoryId:
                            type: string
