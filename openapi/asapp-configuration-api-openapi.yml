      description: 'Retrieves a list of all configured structured data fields.

        '
      operationId: getStructuredDataFields
      responses:
        '200':
          description: Get all structured data fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  structuredDataFields:
                    type: array
