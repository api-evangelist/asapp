    post:
      tags:
      - Configuration
      summary: Create a segment
      description: 'Creates a new `segment` to organize structured data extraction based on conversation metadata.


        A segment consists of:

        1. Query logic that matches conversations based on metadata

        2. A set of structured data fields to extract from matching conversations


        For example, you can create segments to:

        - Extract problem details from support conversations

        - Extract product and promotion info from sales conversations

        '
      operationId: postSegment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Segment
              type: object
              properties:
                id:
                  type: string
                  description: The id of the segment
                name:
                  type: string
                  description: The name of the segment
                query:
                  description: A query that defines which conversations belong to this segment based on their metadata.
                  type: object
                  properties:
                    type:
                      type: string
                      description: Query type (only `raw` supported)
                    raw:
                      type: string
                      description: 'An [SQL-like query string expression](/autosummary/structured-data/segments-and-customization#query) to match conversations based on their metadata.

                        '
                structuredDataFieldIds:
                  type: array
                  items:
                    type: string
                  description: The ids of the structured data fields that will be used to generate the structured data for the conversation.
              example:
                id: USER_SUPPORT
                name: Support
                query:
                  type: raw
                  raw: 'TRUE'
                structuredDataFieldIds: []
