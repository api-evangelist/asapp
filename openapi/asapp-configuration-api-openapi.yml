                  segmentIds:
                    type: array
                    items:
                      type: string
                      description: The segment ids that the structured data field is associated with
                      example: GLOBAL
                required:
                - id
                - active
                - entity
                - type
                - categoryId
                - name
                - segmentIds
                example:
                  id: e_product
                  name: Product Name
                  categoryId: OUTCOME
