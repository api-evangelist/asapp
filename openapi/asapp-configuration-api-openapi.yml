      tags:
      - Configuration
      summary: List structured data fields
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
          nullable: true
        description: Filter by active or non active redaction entities
      - in: query
        name: cursor
        schema:
          type: string
          nullable: true
