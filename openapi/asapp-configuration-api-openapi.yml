  /configuration/v1/redaction-entities:
    get:
      tags:
      - Configuration
      summary: List redaction entities
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          nullable: true
        description: The cursor pointing to the current position
      - in: query
        name: limit
        schema:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          default: 20
        description: The maximum amount of objects to retrieve
      operationId: listRedactionEntities
      description: 'Lists all available redaction entities and their current activation status across different policies.


        Redaction entities represent different types of sensitive information that can be automatically

        redacted from conversations. Each entity can be independently enabled or disabled for different

        redaction policies:

        - Customer Immediate: Redaction in real-time for customer-facing content

        - Customer Delayed: Redaction for stored customer-facing content

        - Agent Immediate: Real-time redaction for agent-facing content

        - Auto Transcribe: Redaction in transcription output

        - Voice: Redaction in voice content


        The API returns immediately, but the redaction service can take up to 1 minute to incorporate the redaction change.

        '
      responses:
        '200':
          description: Successfully retrieved the redaction entities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redactionEntities:
                    type: array
                    description: The list of redaction entities
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The id of the redaction entity
                          example: CREDIT_CARD_NUMBER
                        description:
                          type: string
                          description: The description of the redaction entity
                          example: ''
                        policies:
                          description: A set of policies that control when and how redaction is applied. Each policy can be enabled or disabled independently. Some entities may have a subset of policies. Specifying a policy that is not applicable to an entity will be ignored.
                          type: object
                          properties:
                            customerImmediate:
                              type: boolean
                              description: Immediately redact sensitive information from the customer's view during the live conversation. This is typically used for highly sensitive data like credit card numbers that should never be visible to customers.
                              example: true
                            customerDelayed:
                              type: boolean
                              description: Temporarily show sensitive information to the customer before applying redaction. This allows customers to verify the information was captured correctly before it gets redacted.
                              example: false
                            agentImmediate:
                              type: boolean
                              description: Immediately redact sensitive information from the agent's view. This prevents agents from seeing confidential customer data while still allowing them to assist with the interaction.
                              example: false
                            autoTranscribe:
                              type: boolean
                              description: Redact sensitive information from conversation transcripts. This ensures sensitive data is not stored in transcription records while preserving the context of the conversation.
                              example: false
                            voice:
                              type: boolean
                              description: Redact sensitive information during voice calls.
                              example: false
                      required:
                      - id
                      - description
                      - policies
                      example:
                        id: CREDIT_CARD_NUMBER
                        description: Redacts credit card number
                        policies:
                          customerImmediate: false
                          customerDelayed: false
                          agentImmediate: false
                  nextCursor:
                    type: string
                    nullable: true
                    description: The next cursor to fetch
                    example: 6b29fc40-ca47-1067-b31d-00dd010662da
                  prevCursor:
                    type: string
                    nullable: true
                    description: The previous cursor to fetch
                    example: 04719ebd-13e1-40e9-8b92-0941cd16a19c
                required:
                - redactionEntities
                - nextCursor
                - prevCursor
                example:
                  redactionEntities:
                  - id: CREDIT_CARD_NUMBER
                    description: Redacts credit card number
                    policies:
                      customerImmediate: false
                      customerDelayed: false
                      agentImmediate: false
                  nextCursor: CVV
                  prevCursor: PHONE_NUMBER
        '400':
          description: 400 - Bad request
