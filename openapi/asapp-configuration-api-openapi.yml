                              Possible values:

                              - OUTCOME

                              '
                            example: OUTCOME
                          type:
                            type: string
                            description: 'The type of the structured data field. Must be either:

                              - QUESTION

                              - ENTITY

                              '
                            example: QUESTION
                          active:
                            type: boolean
                            description: Indicates if the structured data is active or not.
                            example: false
                          question:
                            type: object
                            properties:
                              question:
                                type: string
                                description: The question that will be answered using the context of the conversation
                                example: Did the agent offer the correct promotion?
                            required:
                            - question
                          segmentIds:
                            type: array
                            items:
                              type: string
                              description: The segment ids that the structured data field is associated with
                              example: GLOBAL
                        required:
                        - id
