                companySubdivision:
                  description: The company's subdivision of which the issue belongs to
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: Operating
                businessRule:
                  description: The business rule to use
                  type: string
                  maxLength: 256
                  nullable: true
                  example: Apply customer's discount
                entryType:
                  description: The way the issue started and created in the system
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: reactive
                operatingSystem:
                  description: The operating system used to enter the issue
                  type: string
                  enum:
                    - MAC_OS
                    - LINUX
                    - WINDOWS
                    - ANDROID
                    - IOS
                    - OTHER
                  nullable: true
                  example: MAC_OS
                browserType:
                  description: The browser type used
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 64
                  nullable: true
                  example: Safari
                browserVersion:
                  description: The browser version used
                  type: string
                  pattern: '[a-zA-Z0-9\-\_\.]+'
                  maxLength: 16
                  nullable: true
                  example: 14.1.2
                attributes:
                  description: A map of key-value pairs for extra metadata attributes
                  type: array
                  items:
                    description: A key-value pair of additional metadata attributes
                    type: object
                    properties:
                      name:
                        description: The name of the attribute
                        type: string
                        maxLength: 256
                      value:
                        description: The value of the named attribute
                        type: string
                        maxLength: 1024
                    example:
                      - name: attr1_name
                        value: attr1_value
                      - name: attr2_name
                        value: attr2_value
                  maxItems: 10
                  nullable: true
                  example:
                    - name: attr1_name
                      value: attr1_value
                    - name: attr2_name
                      value: attr2_value
              required:
                - externalConversationId
              example:
                externalConversationId: id-1389
                eventId: eventId-1388
                lobId: '1038'
                lobName: manufacturing
