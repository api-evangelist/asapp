    post:
      tags:
        - Metadata
      operationId: singleCustomerMetadata
      summary: Add a customer metadata
      description: |
        Add metadata attributes of one customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A set of customer metadata attributes
              type: object
              properties:
                externalConversationId:
                  description: Conversation ID from the external chat / voice system
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  example: issue509
                externalCustomerId:
                  description: The customer id involved in respect to the issue in question
                  type: string
                  pattern: '[a-zA-Z0-9\-\_\.\@]+'
                  maxLength: 256
                  example: 555.555.0100-jdoe@example.com
                eventId:
                  description: >
                    An event id used to track the submission; if none is
                    provided, service will generate one
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: eventId-1938
                status:
                  description: >-
                    The descriptive label to describe the customer's status
                    and/or type
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: new
                phoneNumber:
                  description: The customer's phone number
                  type: string
                  pattern: '[0-9\-\.\(\)\+]+'
                  maxLength: 32
                  nullable: true
                  example: (555)555-0100
                emailAddress:
                  description: The customer's email address
                  type: string
                  format: email
                  nullable: true
                  example: jdoe@example.com
                userId:
                  description: The customer's user Id
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: user908038
                addressCountry:
                  description: The country portion of the customer's address
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 128
                  nullable: true
                  example: United-States
                addressState:
                  description: The state portion of the customer's address
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 128
                  nullable: true
                  example: New-York
                addressZipcode:
                  description: The zipcode/postal code portion of the customer's address
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 16
                  nullable: true
                  example: '10001'
                attributes:
                  description: A map of key-value pairs for extra metadata attributes
                  type: array
                  items:
                    description: A key-value pair of additional metadata attributes
                    type: object
                    properties:
                      name:
                        description: The name of the attribute
