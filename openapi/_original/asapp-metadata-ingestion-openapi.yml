  /metadata-ingestion/v1/single-convo-metadata:
    post:
      tags:
        - Metadata
      operationId: singleConvoMetadata
      summary: Add a conversation metadata
      description: |
        Add metadata attributes of one issue/conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A set of conversation metadata attributes
              type: object
              properties:
                externalConversationId:
                  description: Conversation ID from the external chat / voice system
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  example: issue1389
                eventId:
                  description: >
                    An event id used to track the submission; if none is
                    provided, service will generate one
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: eventId-1388
                lobId:
                  description: The line of business id
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: '1038'
                lobName:
                  description: The descriptive name of the line of business
                  type: string
                  maxLength: 256
                  nullable: true
                  example: manufacturing
                groupId:
                  description: The group id of which the agent belong to
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: group59
                groupName:
                  description: The descriptive name of the group
                  type: string
                  maxLength: 256
                  nullable: true
                  example: groupXYZ
                agentRoutingCode:
                  description: The agent's routing attribute
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: route-13988
                campaign:
                  description: The activities related to the issue
                  type: string
                  pattern: '[a-zA-Z0-9\-\_]+'
                  maxLength: 256
                  nullable: true
                  example: campaign-A
                deviceType:
                  description: The client's device type
                  type: string
                  enum:
                    - TABLET
                    - PHONE
                    - DESKTOP
                    - WATCH
                    - OTHER
                  nullable: true
                  example: TABLET
                platform:
                  description: |
                    The client's platform type
                    WAB: WhatsApp Business
                  type: string
                  enum:
                    - SMS
                    - WEB
                    - IOS
                    - ANDROID
                    - APP
                    - LOCAL
                    - VOICE
                    - VOICE_IOS
                    - VOICE_ANDROID
                    - VOICE_ECHO
                    - VOICE_HOMEPOD
                    - VOICE_GGLHOME
                    - VOICE_WEB
                    - APPLEBIZ
                    - GOOGLEBIZ
                    - GBM
                    - WAB
                  nullable: true
                  example: IOS
                companySegment:
                  description: The company's segment of which the issue belongs to
                  type: array
                  items:
                    type: string
                    pattern: '[a-zA-Z0-9\-\_]+'
                    maxLength: 64
                  nullable: true
                  example:
                    - Sales
